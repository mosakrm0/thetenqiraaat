name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff pip-audit

      - name: Lint & dependency audit
        run: |
          ruff check .
          pip-audit -r requirements.txt

      - name: Run unit & integration tests
        run: pytest -v

  build-and-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t thetenqiraaat-ci:latest .

      - name: Run container
        run: docker run -d --rm --name thetenqiraaat-ci -p 7860:7860 thetenqiraaat-ci:latest

      - name: Health check
        run: |
          sleep 15
          curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://localhost:7860/

      - name: View container logs (on failure)
        if: failure()
        run: docker logs thetenqiraaat-ci
