<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقارنة الترجمات القرآنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <div id="sidebar">
    <div class="sb-head">
      <button class="sb-close-btn" onclick="toggleSB()" aria-label="إغلاق القائمة" title="إغلاق القائمة">✕</button>
      <div class="logo">
        <span class="logo-icon">☽</span>
        <div>
          <div class="logo-title">مقارنة الترجمات القرآنية</div>
          <div class="logo-sub">١١٤ سورة · ترجمات متعددة اللغات</div>
        </div>
      </div>
      <div class="sb-search">
        <span class="sb-search-ic">🔍</span>
        <input type="text" id="sb-q" placeholder="ابحث عن سورة..." oninput="filterSurahs(this.value)">
      </div>
    </div>
    <div id="surah-list">
      <div class="loader"><div class="loader-ring"></div><div class="loader-txt">جاري التحميل...</div></div>
    </div>
  </div>

  <div id="main">

    <div id="topbar">
      <button id="toggle-sb" onclick="toggleSB()" aria-label="القائمة">☰</button>
      <button id="theme-toggle" onclick="toggleTheme()" aria-label="تبديل الوضع" title="تبديل الوضع">☀️</button>
      <div class="tabs">
        <button class="tab active" id="tab-tr-mushaf" onclick="switchTab('mushaf')">📖 صفحة المصحف</button>
        <button class="tab" id="tab-tr-compare" onclick="switchTab('compare')">⚖️ مقارنة جانبية</button>
        <a class="tab" href="/readings" style="text-decoration:none;display:inline-flex;align-items:center">↩ القراءات</a>
        <a class="tab" href="/feedback" style="text-decoration:none;display:inline-flex;align-items:center">✉️ تواصل</a>
      </div>
      <div class="tb-info">
        <div class="tb-name" id="tb-name">اختر سورة</div>
        <div class="tb-meta" id="tb-meta">—</div>
      </div>
    </div>

    <div id="qiraat-bar">
      <button class="qbar-toggle" id="qbar-toggle" onclick="toggleQiraatBar()" aria-expanded="true">إخفاء الأدوات</button>
      <div class="q-controls-row">
        <div class="tr-filter-wrap">
          <input type="text" id="tr-search" class="tr-search-input" placeholder="ابحث عن لغة أو مترجم..." oninput="filterCatalog(this.value)">
          <label class="opt-toggle">
            <input type="checkbox" id="tr-audio-only" onchange="toggleAudioOnly(this.checked)">
            <span>مع صوت فقط</span>
          </label>
        </div>
        <div class="range-wrap">
          <span>من</span>
          <input type="number" class="r-input" id="r-start" min="1" value="1">
          <span>إلى</span>
          <input type="number" class="r-input" id="r-end" min="1" value="7">
          <button class="btn-go" onclick="loadContent()">عرض</button>
        </div>
        <div class="audio-opts-wrap">
          <label class="opt-toggle">
            <input type="checkbox" id="opt-autoplay" onchange="setAutoPlay(this.checked)">
            <span>تشغيل متتابع</span>
          </label>
          <select id="opt-speed" class="speed-select" onchange="setPlaybackSpeed(this.value)" aria-label="سرعة التشغيل">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
          </select>
        </div>
      </div>
      <div class="tr-chips-wrap" id="tr-chips"></div>
    </div>

    <div id="content">
      <div class="empty-state">
        <span class="empty-icon">☽</span>
        <div class="empty-title">اختر سورة ثم اختر الترجمات</div>
        <div class="empty-sub">ثم اضغط «عرض» لمشاهدة المقارنة النصية آية بآية</div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>
<script src="/static/common.js"></script>
<script src="/static/translations.js"></script>
</body>
</html>
